<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EchoBubbleLoop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: rgba(8, 12, 24, 0.74);
      --border: rgba(255, 255, 255, 0.18);
      --text: #f1f5ff;
      --accent: #8fe7ff;
      --accent-strong: #61b8ff;
      --danger: #ff7f9f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #182142 0%, #060812 40%, #02030a 100%);
    }

    canvas {
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .panel {
      width: min(420px, 100%);
      pointer-events: auto;
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.35);
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .mode {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(143, 231, 255, 0.12);
      border: 1px solid rgba(143, 231, 255, 0.2);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button,
    .file-label {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 14px;
      color: white;
      background: linear-gradient(135deg, rgba(97, 184, 255, 0.92), rgba(143, 231, 255, 0.72));
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease, background 140ms ease;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    button.secondary,
    .file-label {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    button.danger {
      background: rgba(255, 127, 159, 0.18);
      border: 1px solid rgba(255, 127, 159, 0.3);
      color: #ffd7e2;
    }

    button:disabled,
    .file-label.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:not(:disabled):active,
    .file-label:not(.disabled):active {
      transform: scale(0.98);
    }

    input[type="file"] {
      display: none;
    }

    .status {
      padding: 12px 14px;
      min-height: 72px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.4;
      font-size: 0.92rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.76);
    }

    .legend span {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="panel">
      <div class="heading">
        <div class="title">EchoBubbleLoop</div>
        <div id="modeBadge" class="mode">Creation mode</div>
      </div>

      <div class="controls">
        <button id="enterArBtn">ENTER AR</button>
        <label id="fileLabel" class="file-label" for="audioInput">IMPORT AUDIO</label>
        <button id="modeBtn" class="secondary">Listening Mode</button>
        <button id="clearBtn" class="danger">CLEAR ALL</button>
      </div>

      <input id="audioInput" type="file" accept="audio/mpeg,audio/wav,audio/mp3,audio/x-wav,audio/*" />

      <div id="status" class="status">Load an audio file to start planting sound bubbles. WebXR AR requires a compatible Android device, Chrome, ARCore, and HTTPS.</div>

      <div class="legend">
        <span>Tap surface to place</span>
        <span>Max 10 bubbles</span>
        <span>Looped spatial audio</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const MAX_BUBBLES = 10;
    const FLOAT_SPEED = 0.8;
    const FLOAT_HEIGHT = 0.035;
    const DRIFT_AMOUNT = 0.015;

    const enterArBtn = document.getElementById('enterArBtn');
    const clearBtn = document.getElementById('clearBtn');
    const audioInput = document.getElementById('audioInput');
    const fileLabel = document.getElementById('fileLabel');
    const modeBtn = document.getElementById('modeBtn');
    const statusEl = document.getElementById('status');
    const modeBadge = document.getElementById('modeBadge');

    let renderer;
    let scene;
    let camera;
    let reticle;
    let xrSession = null;
    let referenceSpace = null;
    let viewerSpace = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let audioContext = null;
    let audioBuffer = null;
    let masterGain = null;
    let bubbles = [];
    let bubbleId = 0;
    let isListeningMode = false;

    const listenerPosition = new THREE.Vector3();
    const listenerQuaternion = new THREE.Quaternion();
    const listenerForward = new THREE.Vector3(0, 0, -1);
    const listenerUp = new THREE.Vector3(0, 1, 0);
    const bubbleWorldPosition = new THREE.Vector3();
    const bubbleVisualOffset = new THREE.Vector3();
    const tempMatrix = new THREE.Matrix4();
    const clock = new THREE.Clock();

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.HemisphereLight(0xbbe7ff, 0x334455, 1.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      const reticleGeometry = new THREE.RingGeometry(0.07, 0.09, 48).rotateX(-Math.PI / 2);
      const reticleMaterial = new THREE.MeshBasicMaterial({
        color: 0x8fe7ff,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
      });
      reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      window.addEventListener('resize', onWindowResize);
      enterArBtn.addEventListener('click', onEnterAr);
      clearBtn.addEventListener('click', clearAllBubbles);
      modeBtn.addEventListener('click', toggleMode);
      audioInput.addEventListener('change', onAudioSelected);

      updateUiState();
      setStatus('Ready. Import a sound, then enter AR and tap a surface to place an Echo Bubble.');
      renderer.setAnimationLoop(render);

      if (!navigator.xr) {
        enterArBtn.disabled = true;
        setStatus('WebXR is unavailable in this browser. Use Chrome on Android with ARCore over HTTPS.');
      } else {
        checkArSupport();
      }
    }

    async function checkArSupport() {
      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          enterArBtn.disabled = true;
          setStatus('Immersive AR is not supported on this device. EchoBubbleLoop needs Chrome Android + ARCore.');
        }
      } catch (error) {
        enterArBtn.disabled = true;
        setStatus(`Unable to verify AR support: ${error.message}`);
      }
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          throw new Error('Web Audio is unavailable in this browser.');
        }

        audioContext = new AudioContextClass({ latencyHint: 'interactive' });
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.9;
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      return audioContext;
    }

    async function onAudioSelected(event) {
      const file = event.target.files?.[0];
      if (!file) {
        return;
      }

      try {
        const context = await ensureAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await context.decodeAudioData(arrayBuffer.slice(0));
        fileLabel.textContent = file.name.length > 20 ? `${file.name.slice(0, 17)}...` : file.name;
        setStatus(`Loaded audio: ${file.name}. Enter AR and tap a detected surface to place looping bubbles.`);

        for (const bubble of bubbles) {
          rebuildBubbleAudio(bubble);
        }
      } catch (error) {
        console.error(error);
        audioBuffer = null;
        setStatus(`Audio import failed: ${error.message}`);
      }
    }

    async function onEnterAr() {
      if (!navigator.xr) {
        setStatus('WebXR is unavailable in this browser.');
        return;
      }

      if (xrSession) {
        await xrSession.end();
        return;
      }

      try {
        await ensureAudioContext();
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay', 'local-floor'],
          domOverlay: { root: document.getElementById('overlay') },
        });

        xrSession = session;
        xrSession.addEventListener('end', onSessionEnd);
        xrSession.addEventListener('select', onSelect);

        renderer.xr.setReferenceSpaceType('local');
        await renderer.xr.setSession(session);

        referenceSpace = await session.requestReferenceSpace('local');
        viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        hitTestSourceRequested = true;

        enterArBtn.textContent = 'EXIT AR';
        setStatus(audioBuffer
          ? 'AR started. Move until the reticle appears, then tap to place a sound bubble.'
          : 'AR started. Import audio first, then tap a surface to place a sound bubble.');
      } catch (error) {
        console.error(error);
        setStatus(`Failed to start AR session: ${error.message}`);
      }
    }

    function onSessionEnd() {
      const session = xrSession;
      session?.removeEventListener('end', onSessionEnd);
      session?.removeEventListener('select', onSelect);
      xrSession = null;

      if (hitTestSource) {
        hitTestSource.cancel();
        hitTestSource = null;
      }

      referenceSpace = null;
      viewerSpace = null;
      hitTestSourceRequested = false;
      reticle.visible = false;
      enterArBtn.textContent = 'ENTER AR';
      setStatus('AR session ended. You can re-enter AR at any time.');
    }

    function onSelect() {
      if (isListeningMode) {
        setStatus('Listening mode is active. Switch back to Creation mode to place new bubbles.');
        return;
      }

      if (!reticle.visible) {
        setStatus('No surface found yet. Slowly scan the environment until the reticle appears.');
        return;
      }

      if (!audioBuffer) {
        setStatus('Import an audio file before placing bubbles.');
        return;
      }

      placeBubbleFromReticle();
    }

    function placeBubbleFromReticle() {
      const bubble = createBubble();
      tempMatrix.copy(reticle.matrix);
      bubble.root.position.setFromMatrixPosition(tempMatrix);
      bubble.root.quaternion.setFromRotationMatrix(tempMatrix);
      bubble.root.scale.setScalar(1);
      scene.add(bubble.root);
      bubbles.push(bubble);

      if (bubbles.length > MAX_BUBBLES) {
        destroyBubble(bubbles.shift());
      }

      setStatus(`Placed bubble ${bubbles.length}/${MAX_BUBBLES}. Walk around to hear its spatial loop.`);
      updateUiState();
    }

    function createBubble() {
      const root = new THREE.Group();
      root.matrixAutoUpdate = true;

      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 32, 32),
        new THREE.MeshPhysicalMaterial({
          color: 0x82d9ff,
          transparent: true,
          opacity: 0.35,
          roughness: 0.15,
          metalness: 0,
          transmission: 0.55,
          thickness: 0.4,
          clearcoat: 1,
          emissive: 0x1f6cff,
          emissiveIntensity: 0.45,
        }),
      );

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.115, 24, 24),
        new THREE.MeshBasicMaterial({
          color: 0x8fe7ff,
          transparent: true,
          opacity: 0.12,
          depthWrite: false,
        }),
      );

      root.add(glow);
      root.add(sphere);

      const bubble = {
        id: ++bubbleId,
        root,
        sphere,
        glow,
        createdAt: performance.now() * 0.001,
        seed: Math.random() * Math.PI * 2,
        audio: null,
      };

      rebuildBubbleAudio(bubble);
      return bubble;
    }

    function rebuildBubbleAudio(bubble) {
      stopBubbleAudio(bubble);

      if (!audioContext || !audioBuffer) {
        return;
      }

      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.loop = true;

      const panner = audioContext.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'linear';
      panner.refDistance = 0.3;
      panner.maxDistance = 8;
      panner.rolloffFactor = 1;
      panner.coneInnerAngle = 360;
      panner.coneOuterAngle = 0;

      const gain = audioContext.createGain();
      gain.gain.value = 0.0001;

      source.connect(gain);
      gain.connect(panner);
      panner.connect(masterGain);
      source.start();

      bubble.audio = { source, panner, gain };
    }

    function stopBubbleAudio(bubble) {
      if (!bubble?.audio) {
        return;
      }

      const { source, panner, gain } = bubble.audio;
      try {
        gain.disconnect();
        panner.disconnect();
        source.disconnect();
        source.stop();
      } catch {
        // No-op on already-stopped nodes.
      }
      bubble.audio = null;
    }

    function clearAllBubbles() {
      for (const bubble of bubbles) {
        destroyBubble(bubble);
      }
      bubbles = [];
      setStatus('All bubbles cleared. Import audio and place new ones whenever you like.');
      updateUiState();
    }

    function destroyBubble(bubble) {
      if (!bubble) {
        return;
      }
      stopBubbleAudio(bubble);
      scene.remove(bubble.root);
      bubble.root.traverse((object) => {
        if (object.geometry) object.geometry.dispose();
        if (object.material) {
          if (Array.isArray(object.material)) {
            object.material.forEach((material) => material.dispose());
          } else {
            object.material.dispose();
          }
        }
      });
    }

    function toggleMode() {
      isListeningMode = !isListeningMode;
      modeBtn.textContent = isListeningMode ? 'Creation Mode' : 'Listening Mode';
      updateUiState();
      setStatus(isListeningMode
        ? 'Listening mode active. Walk around to explore the sound field.'
        : 'Creation mode active. Tap the reticle to place new bubbles.');
    }

    function updateUiState() {
      modeBadge.textContent = isListeningMode ? 'Listening mode' : 'Creation mode';
      clearBtn.disabled = bubbles.length === 0;
      fileLabel.classList.toggle('disabled', false);
      if (!navigator.xr) {
        enterArBtn.disabled = true;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateHitTest(frame) {
      if (!xrSession || !hitTestSourceRequested || !frame || !referenceSpace || !hitTestSource) {
        reticle.visible = false;
        return;
      }

      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const pose = hitTestResults[0].getPose(referenceSpace);
        if (pose) {
          reticle.visible = !isListeningMode;
          reticle.matrix.fromArray(pose.transform.matrix);
          return;
        }
      }

      reticle.visible = false;
    }

    function updateListener() {
      if (!audioContext) {
        return;
      }

      camera.getWorldPosition(listenerPosition);
      camera.getWorldQuaternion(listenerQuaternion);

      const forward = listenerForward.clone().applyQuaternion(listenerQuaternion).normalize();
      const up = listenerUp.clone().applyQuaternion(listenerQuaternion).normalize();
      const listener = audioContext.listener;
      const t = audioContext.currentTime;

      if (listener.positionX) {
        listener.positionX.setValueAtTime(listenerPosition.x, t);
        listener.positionY.setValueAtTime(listenerPosition.y, t);
        listener.positionZ.setValueAtTime(listenerPosition.z, t);
        listener.forwardX.setValueAtTime(forward.x, t);
        listener.forwardY.setValueAtTime(forward.y, t);
        listener.forwardZ.setValueAtTime(forward.z, t);
        listener.upX.setValueAtTime(up.x, t);
        listener.upY.setValueAtTime(up.y, t);
        listener.upZ.setValueAtTime(up.z, t);
      } else {
        listener.setPosition(listenerPosition.x, listenerPosition.y, listenerPosition.z);
        listener.setOrientation(forward.x, forward.y, forward.z, up.x, up.y, up.z);
      }
    }

    function updateBubbles(delta, elapsedTime) {
      for (const bubble of bubbles) {
        const bob = Math.sin(elapsedTime * FLOAT_SPEED + bubble.seed) * FLOAT_HEIGHT;
        const driftX = Math.sin(elapsedTime * 0.31 + bubble.seed * 1.7) * DRIFT_AMOUNT;
        const driftZ = Math.cos(elapsedTime * 0.27 + bubble.seed * 1.3) * DRIFT_AMOUNT;

        bubbleVisualOffset.set(driftX, bob, driftZ);
        bubble.sphere.position.copy(bubbleVisualOffset);
        bubble.glow.position.copy(bubbleVisualOffset);
        bubble.glow.scale.setScalar(1 + Math.sin(elapsedTime * 0.9 + bubble.seed) * 0.05);
        bubble.sphere.scale.setScalar(1 + Math.sin(elapsedTime * 1.3 + bubble.seed) * 0.02);
        bubble.root.rotation.y += delta * 0.25;

        if (!bubble.audio) {
          continue;
        }

        bubble.root.getWorldPosition(bubbleWorldPosition);
        bubbleWorldPosition.add(bubbleVisualOffset);

        const distance = bubbleWorldPosition.distanceTo(listenerPosition);
        const targetGain = THREE.MathUtils.clamp(1 - distance / 8, 0.03, 1);
        const now = audioContext.currentTime;
        bubble.audio.gain.gain.cancelScheduledValues(now);
        bubble.audio.gain.gain.setTargetAtTime(targetGain, now, 0.08);

        const { panner } = bubble.audio;
        if (panner.positionX) {
          panner.positionX.setValueAtTime(bubbleWorldPosition.x, now);
          panner.positionY.setValueAtTime(bubbleWorldPosition.y, now);
          panner.positionZ.setValueAtTime(bubbleWorldPosition.z, now);
        } else {
          panner.setPosition(bubbleWorldPosition.x, bubbleWorldPosition.y, bubbleWorldPosition.z);
        }
      }
    }

    function render(timestamp, frame) {
      const delta = clock.getDelta();
      const elapsedTime = timestamp ? timestamp * 0.001 : clock.elapsedTime;

      updateHitTest(frame);
      updateListener();
      updateBubbles(delta, elapsedTime);
      renderer.render(scene, camera);
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }
  </script>
</body>
</html>
