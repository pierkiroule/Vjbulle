<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EchoBubbleLoop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: rgba(8, 12, 24, 0.76);
      --border: rgba(255, 255, 255, 0.16);
      --text: #eff4ff;
      --accent: #87e6ff;
      --soft: rgba(255, 255, 255, 0.1);
      --danger: rgba(255, 120, 155, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #172347 0%, #070a14 42%, #020309 100%);
    }

    canvas {
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .panel {
      width: min(440px, 100%);
      pointer-events: auto;
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--bg);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .heading,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(135, 230, 255, 0.12);
      border: 1px solid rgba(135, 230, 255, 0.18);
      color: var(--accent);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button,
    .file-label,
    select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 13px 14px;
      font: inherit;
      color: white;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 140ms ease, opacity 140ms ease, background 140ms ease;
    }

    button.primary {
      background: linear-gradient(135deg, rgba(97, 184, 255, 0.94), rgba(135, 230, 255, 0.72));
      border: 0;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.78rem;
    }

    button.danger {
      background: var(--danger);
      color: #ffd5e2;
    }

    button:disabled,
    .file-label.disabled,
    select:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:not(:disabled):active,
    .file-label:not(.disabled):active {
      transform: scale(0.98);
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.78rem;
    }

    input[type="file"] {
      display: none;
    }

    .label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.7);
    }

    .source-wrap {
      display: grid;
      gap: 8px;
    }

    .status {
      min-height: 78px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.45;
      font-size: 0.92rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.78rem;
    }

    .legend span {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="panel">
      <div class="heading">
        <div class="title">EchoBubbleLoop</div>
        <div id="modeBadge" class="badge">Creation mode</div>
      </div>

      <div class="controls">
        <button id="enterArBtn" class="primary">ENTER AR</button>
        <label id="fileLabel" class="file-label" for="audioInput">IMPORT AUDIO</label>
        <button id="modeBtn">Listening Mode</button>
        <button id="clearBtn" class="danger">CLEAR ALL</button>
      </div>

      <input id="audioInput" type="file" accept="audio/*,.mp3,.wav" multiple />

      <div class="source-wrap">
        <div class="row">
          <div class="label">Current source</div>
          <div id="libraryBadge" class="badge">0 files</div>
        </div>
        <select id="audioSelect" disabled>
          <option value="">Import audio files first</option>
        </select>
      </div>

      <div id="status" class="status">
        Import one or more sounds, choose the current source, enter AR, then tap surfaces to build a layered spatial soundscape.
      </div>

      <div class="legend">
        <span>Tap surface to place</span>
        <span>Max 8 live bubbles</span>
        <span>Independent spatial loops</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const MAX_BUBBLES = 8;
    const FLOAT_SPEED = 0.7;
    const FLOAT_HEIGHT = 0.03;
    const DRIFT_AMOUNT = 0.014;
    const MAX_AUDIBLE_DISTANCE = 10;

    const enterArBtn = document.getElementById('enterArBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modeBtn = document.getElementById('modeBtn');
    const audioInput = document.getElementById('audioInput');
    const audioSelect = document.getElementById('audioSelect');
    const fileLabel = document.getElementById('fileLabel');
    const statusEl = document.getElementById('status');
    const modeBadge = document.getElementById('modeBadge');
    const libraryBadge = document.getElementById('libraryBadge');

    let renderer;
    let scene;
    let camera;
    let reticle;

    let xrSession = null;
    let referenceSpace = null;
    let viewerSpace = null;
    let hitTestSource = null;

    let audioContext = null;
    let mixGain = null;
    let selectedAssetId = '';
    let assetCounter = 0;
    let bubbleCounter = 0;
    let isListeningMode = false;

    const audioLibrary = [];
    const bubbles = [];

    const clock = new THREE.Clock();
    const tempMatrix = new THREE.Matrix4();
    const listenerPosition = new THREE.Vector3();
    const listenerQuaternion = new THREE.Quaternion();
    const listenerForward = new THREE.Vector3(0, 0, -1);
    const listenerUp = new THREE.Vector3(0, 1, 0);
    const tempForward = new THREE.Vector3();
    const tempUp = new THREE.Vector3();
    const bubbleOffset = new THREE.Vector3();
    const bubblePosition = new THREE.Vector3();

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xb9e6ff, 0x314259, 1.5));
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.55);
      directionalLight.position.set(1, 2, 1);
      scene.add(directionalLight);

      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.065, 0.085, 48).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({
          color: 0x87e6ff,
          transparent: true,
          opacity: 0.9,
          side: THREE.DoubleSide,
        }),
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      window.addEventListener('resize', onWindowResize);
      enterArBtn.addEventListener('click', onEnterAr);
      clearBtn.addEventListener('click', clearAllBubbles);
      modeBtn.addEventListener('click', toggleMode);
      audioInput.addEventListener('change', onAudioImported);
      audioSelect.addEventListener('change', onAudioSelected);

      renderer.setAnimationLoop(render);
      updateUi();
      setStatus('Import one or more sounds to create a multi-source AR soundscape. Each new bubble uses the currently selected source.');

      if (!navigator.xr) {
        enterArBtn.disabled = true;
        setStatus('WebXR is unavailable. Use Chrome on Android with ARCore over HTTPS.');
        return;
      }

      checkArSupport();
    }

    async function checkArSupport() {
      try {
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          enterArBtn.disabled = true;
          setStatus('Immersive AR is not supported on this device. EchoBubbleLoop needs Chrome Android + ARCore.');
        }
      } catch (error) {
        enterArBtn.disabled = true;
        setStatus(`Unable to verify AR support: ${error.message}`);
      }
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          throw new Error('Web Audio API is unavailable in this browser.');
        }

        audioContext = new AudioContextClass({ latencyHint: 'interactive' });
        mixGain = audioContext.createGain();
        mixGain.gain.value = 0.9;
        mixGain.connect(audioContext.destination);
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      return audioContext;
    }

    async function onAudioImported(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) {
        return;
      }

      try {
        await ensureAudioContext();
      } catch (error) {
        setStatus(`Audio initialization failed: ${error.message}`);
        return;
      }

      for (const file of files) {
        const asset = {
          id: `asset-${++assetCounter}`,
          name: file.name,
          url: URL.createObjectURL(file),
          type: file.type || 'audio/*',
        };
        audioLibrary.push(asset);
        selectedAssetId = asset.id;
      }

      audioInput.value = '';
      refreshAudioSelect();
      updateUi();

      const selectedAsset = getSelectedAsset();
      setStatus(selectedAsset
        ? `Imported ${files.length} sound${files.length > 1 ? 's' : ''}. Current source: ${selectedAsset.name}. Tap in AR to place layered sound bubbles.`
        : 'Audio imported. Choose a source to continue.');
    }

    function refreshAudioSelect() {
      audioSelect.innerHTML = '';

      if (!audioLibrary.length) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Import audio files first';
        audioSelect.append(option);
        audioSelect.disabled = true;
        return;
      }

      for (const asset of audioLibrary) {
        const option = document.createElement('option');
        option.value = asset.id;
        option.textContent = asset.name;
        if (asset.id === selectedAssetId) {
          option.selected = true;
        }
        audioSelect.append(option);
      }

      audioSelect.disabled = false;
    }

    function onAudioSelected(event) {
      selectedAssetId = event.target.value;
      const asset = getSelectedAsset();
      if (asset) {
        setStatus(`Current source changed to ${asset.name}. Existing bubbles keep playing; new bubbles will use this source.`);
      }
      updateUi();
    }

    async function onEnterAr() {
      if (!navigator.xr) {
        setStatus('WebXR is unavailable in this browser.');
        return;
      }

      if (xrSession) {
        await xrSession.end();
        return;
      }

      try {
        await ensureAudioContext();
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay', 'local-floor'],
          domOverlay: { root: document.getElementById('overlay') },
        });

        xrSession = session;
        xrSession.addEventListener('end', onSessionEnd);
        xrSession.addEventListener('select', onSelect);

        renderer.xr.setReferenceSpaceType('local');
        await renderer.xr.setSession(session);

        referenceSpace = await session.requestReferenceSpace('local');
        viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

        enterArBtn.textContent = 'EXIT AR';
        setStatus(getSelectedAsset()
          ? 'AR started. Scan until the reticle appears, then tap to place the selected sound in space.'
          : 'AR started. Import and select a sound source before placing bubbles.');
      } catch (error) {
        console.error(error);
        setStatus(`Failed to start AR session: ${error.message}`);
      }
    }

    function onSessionEnd() {
      const session = xrSession;
      session?.removeEventListener('end', onSessionEnd);
      session?.removeEventListener('select', onSelect);
      xrSession = null;

      if (hitTestSource) {
        hitTestSource.cancel();
        hitTestSource = null;
      }

      referenceSpace = null;
      viewerSpace = null;
      reticle.visible = false;
      enterArBtn.textContent = 'ENTER AR';
      setStatus('AR session ended. Re-enter AR to keep building your sound environment.');
    }

    async function onSelect() {
      if (isListeningMode) {
        setStatus('Listening mode is active. Switch back to Creation mode to place more sound bubbles.');
        return;
      }

      if (!reticle.visible) {
        setStatus('No surface detected yet. Slowly move the device until the reticle locks onto a real surface.');
        return;
      }

      const asset = getSelectedAsset();
      if (!asset) {
        setStatus('Import and select an audio source before placing a bubble.');
        return;
      }

      try {
        await ensureAudioContext();
        await placeBubbleFromReticle(asset);
      } catch (error) {
        console.error(error);
        setStatus(`Unable to place bubble: ${error.message}`);
      }
    }

    async function placeBubbleFromReticle(asset) {
      const bubble = await createBubble(asset);
      tempMatrix.copy(reticle.matrix);
      bubble.root.position.setFromMatrixPosition(tempMatrix);
      bubble.root.quaternion.setFromRotationMatrix(tempMatrix);
      scene.add(bubble.root);
      bubbles.push(bubble);

      if (bubbles.length > MAX_BUBBLES) {
        destroyBubble(bubbles.shift());
      }

      setStatus(`Placed ${asset.name}. ${bubbles.length}/${MAX_BUBBLES} bubbles active. Keep walking to hear the soundscape blend.`);
      updateUi();
    }

    async function createBubble(asset) {
      const root = new THREE.Group();

      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 28, 28),
        new THREE.MeshPhysicalMaterial({
          color: 0x87d9ff,
          transparent: true,
          opacity: 0.34,
          roughness: 0.16,
          transmission: 0.55,
          thickness: 0.45,
          clearcoat: 1,
          emissive: 0x1e67ff,
          emissiveIntensity: 0.5,
        }),
      );

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.115, 24, 24),
        new THREE.MeshBasicMaterial({
          color: 0x87e6ff,
          transparent: true,
          opacity: 0.11,
          depthWrite: false,
        }),
      );

      root.add(glow);
      root.add(sphere);

      const audio = await createBubbleAudio(asset);

      return {
        id: `bubble-${++bubbleCounter}`,
        assetId: asset.id,
        assetName: asset.name,
        root,
        sphere,
        glow,
        seed: Math.random() * Math.PI * 2,
        audio,
      };
    }

    async function createBubbleAudio(asset) {
      const context = await ensureAudioContext();
      const element = document.createElement('audio');
      element.src = asset.url;
      element.loop = true;
      element.preload = 'auto';
      element.crossOrigin = 'anonymous';
      element.playsInline = true;

      const source = context.createMediaElementSource(element);
      const gain = context.createGain();
      const panner = context.createPanner();

      panner.panningModel = 'HRTF';
      panner.distanceModel = 'inverse';
      panner.refDistance = 0.45;
      panner.maxDistance = MAX_AUDIBLE_DISTANCE;
      panner.rolloffFactor = 1.7;
      panner.coneInnerAngle = 360;
      panner.coneOuterAngle = 0;

      gain.gain.value = 0.0001;

      source.connect(gain);
      gain.connect(panner);
      panner.connect(mixGain);

      try {
        await element.play();
      } catch (error) {
        throw new Error(`Audio playback failed for ${asset.name}: ${error.message}`);
      }

      return { element, source, gain, panner };
    }

    function destroyBubble(bubble) {
      if (!bubble) {
        return;
      }

      stopBubbleAudio(bubble.audio);
      scene.remove(bubble.root);
      bubble.root.traverse((object) => {
        if (object.geometry) {
          object.geometry.dispose();
        }
        if (object.material) {
          if (Array.isArray(object.material)) {
            object.material.forEach((material) => material.dispose());
          } else {
            object.material.dispose();
          }
        }
      });
    }

    function stopBubbleAudio(audio) {
      if (!audio) {
        return;
      }

      const { element, source, gain, panner } = audio;
      try {
        element.pause();
        element.src = '';
        element.load();
        source.disconnect();
        gain.disconnect();
        panner.disconnect();
      } catch {
        // Ignore teardown errors from already-cleaned nodes.
      }
    }

    function clearAllBubbles() {
      while (bubbles.length) {
        destroyBubble(bubbles.shift());
      }

      setStatus('All bubbles cleared. Import or select a source and place new layers to rebuild the soundscape.');
      updateUi();
    }

    function toggleMode() {
      isListeningMode = !isListeningMode;
      modeBtn.textContent = isListeningMode ? 'Creation Mode' : 'Listening Mode';
      modeBadge.textContent = isListeningMode ? 'Listening mode' : 'Creation mode';
      setStatus(isListeningMode
        ? 'Listening mode active. Walk through the space and hear all active bubbles blend together.'
        : 'Creation mode active. Tap the reticle to place more sources in your environment.');
    }

    function updateUi() {
      const hasAudio = audioLibrary.length > 0;
      const selectedAsset = getSelectedAsset();

      fileLabel.classList.toggle('disabled', false);
      clearBtn.disabled = bubbles.length === 0;
      audioSelect.disabled = !hasAudio;
      libraryBadge.textContent = `${audioLibrary.length} file${audioLibrary.length === 1 ? '' : 's'}`;

      if (!navigator.xr) {
        enterArBtn.disabled = true;
      }

      if (selectedAsset) {
        audioSelect.value = selectedAsset.id;
      }
    }

    function getSelectedAsset() {
      return audioLibrary.find((asset) => asset.id === selectedAssetId) || null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateHitTest(frame) {
      if (!xrSession || !frame || !referenceSpace || !hitTestSource) {
        reticle.visible = false;
        return;
      }

      const hitResults = frame.getHitTestResults(hitTestSource);
      if (!hitResults.length) {
        reticle.visible = false;
        return;
      }

      const pose = hitResults[0].getPose(referenceSpace);
      if (!pose) {
        reticle.visible = false;
        return;
      }

      reticle.visible = !isListeningMode;
      reticle.matrix.fromArray(pose.transform.matrix);
    }

    function updateListener() {
      if (!audioContext) {
        return;
      }

      camera.getWorldPosition(listenerPosition);
      camera.getWorldQuaternion(listenerQuaternion);

      tempForward.copy(listenerForward).applyQuaternion(listenerQuaternion).normalize();
      tempUp.copy(listenerUp).applyQuaternion(listenerQuaternion).normalize();

      const listener = audioContext.listener;
      const now = audioContext.currentTime;

      if (listener.positionX) {
        listener.positionX.setValueAtTime(listenerPosition.x, now);
        listener.positionY.setValueAtTime(listenerPosition.y, now);
        listener.positionZ.setValueAtTime(listenerPosition.z, now);
        listener.forwardX.setValueAtTime(tempForward.x, now);
        listener.forwardY.setValueAtTime(tempForward.y, now);
        listener.forwardZ.setValueAtTime(tempForward.z, now);
        listener.upX.setValueAtTime(tempUp.x, now);
        listener.upY.setValueAtTime(tempUp.y, now);
        listener.upZ.setValueAtTime(tempUp.z, now);
      } else {
        listener.setPosition(listenerPosition.x, listenerPosition.y, listenerPosition.z);
        listener.setOrientation(tempForward.x, tempForward.y, tempForward.z, tempUp.x, tempUp.y, tempUp.z);
      }
    }

    function updateBubbles(delta, elapsedTime) {
      for (const bubble of bubbles) {
        const bob = Math.sin(elapsedTime * FLOAT_SPEED + bubble.seed) * FLOAT_HEIGHT;
        const driftX = Math.sin(elapsedTime * 0.33 + bubble.seed * 1.8) * DRIFT_AMOUNT;
        const driftZ = Math.cos(elapsedTime * 0.27 + bubble.seed * 1.4) * DRIFT_AMOUNT;

        bubbleOffset.set(driftX, bob, driftZ);
        bubble.sphere.position.copy(bubbleOffset);
        bubble.glow.position.copy(bubbleOffset);
        bubble.glow.scale.setScalar(1 + Math.sin(elapsedTime * 0.8 + bubble.seed) * 0.06);
        bubble.sphere.scale.setScalar(1 + Math.sin(elapsedTime * 1.1 + bubble.seed) * 0.02);
        bubble.root.rotation.y += delta * 0.2;

        bubble.root.getWorldPosition(bubblePosition);
        bubblePosition.add(bubbleOffset);

        const distance = bubblePosition.distanceTo(listenerPosition);
        const targetGain = THREE.MathUtils.clamp(1 - distance / MAX_AUDIBLE_DISTANCE, 0.02, 1);
        const now = audioContext ? audioContext.currentTime : 0;

        if (bubble.audio?.gain) {
          bubble.audio.gain.gain.cancelScheduledValues(now);
          bubble.audio.gain.gain.setTargetAtTime(targetGain, now, 0.1);
        }

        const panner = bubble.audio?.panner;
        if (!panner) {
          continue;
        }

        if (panner.positionX) {
          panner.positionX.setValueAtTime(bubblePosition.x, now);
          panner.positionY.setValueAtTime(bubblePosition.y, now);
          panner.positionZ.setValueAtTime(bubblePosition.z, now);
        } else {
          panner.setPosition(bubblePosition.x, bubblePosition.y, bubblePosition.z);
        }
      }
    }

    function render(timestamp, frame) {
      const delta = clock.getDelta();
      const elapsedTime = timestamp ? timestamp * 0.001 : clock.elapsedTime;

      updateHitTest(frame);
      updateListener();
      updateBubbles(delta, elapsedTime);
      renderer.render(scene, camera);
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }
  </script>
</body>
</html>
